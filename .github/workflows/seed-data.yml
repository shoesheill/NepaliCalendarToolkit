name: Seed Calendar Data

on:
  schedule:
    # Run on the first day of every month, plus April 5 for the Nepali New Year data refresh.
    - cron: "0 0 1 * *"
    - cron: "0 0 5 4 *"
  # Allow running the seeder any time from the GitHub Actions UI.
  workflow_dispatch:
    inputs:
      max_year:
        description: "Optional BS year to seed up to (e.g. 2085). Empty uses the current BS year."
        required: false
        type: string
      details_year:
        description: "Optional BS year to refresh Events + DayDetails for (e.g. 2080). When set, only that detail refresh runs and max_year is ignored."
        required: false
        type: string

permissions:
  # contents:write -> commit + push the data branch; pull-requests:write -> create + merge the PR.
  contents: write
  pull-requests: write

jobs:
  seed:
    name: Seed and commit calendar data
    runs-on: ubuntu-latest
    env:
      SEEDER_PROJECT: tools/NepaliCalendarDataSeeder/NepaliCalendarDataSeeder.csproj
      # appsettings.json is gitignored, so a clean CI checkout has no API_URL config.
      # The seeder's Program.cs reads the API_URL env var first. Source it from the
      # API_URL repo variable (Settings -> Secrets and variables -> Actions ->
      # Variables) so the seeder can reach the Nepal Patro endpoint.
      API_URL: ${{ vars.API_URL }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Run data seeder
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.max_year }}" ]; then
            ARGS="$ARGS --max-year ${{ github.event.inputs.max_year }}"
          fi
          if [ -n "${{ github.event.inputs.details_year }}" ]; then
            ARGS="$ARGS --details-year ${{ github.event.inputs.details_year }}"
          fi
          dotnet run -c Release --project "$SEEDER_PROJECT" $ARGS

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit refreshed data
        id: commit
        run: |
          # -f because .gitignore lists Data/. The existing files commit anyway (tracked
          # files override ignore rules), but a NEW one is skipped silently — which would
          # have swallowed month-meta.json, and equally Events/{year}.json or DayDetails/{year}.json the first time
          # a new year appears.
          git add -f Data SeedInfo.json
          if git diff --cached --quiet; then
            echo "committed=false" >> "$GITHUB_OUTPUT"
            echo "No data changes to commit."
          else
            git commit -m "chore(data): refresh seeded calendar data"
            echo "committed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Push data branch
        if: steps.commit.outputs.committed == 'true'
        run: |
          BRANCH="chore/seeded-data-$(date -u +%Y%m%d-%H%M%S)"
          echo "BRANCH=$BRANCH" >> "$GITHUB_ENV"
          git push -u origin "HEAD:$BRANCH"

      - name: Open and merge pull request
        if: steps.commit.outputs.committed == 'true'
        env:
          # PAT for a repo admin. Main's ruleset requires 1 approving review, but
          # its bypass_actors list grants the admin role "always" bypass - so an
          # admin-owned PAT can merge straight through without needing a (self-)
          # approval, which GitHub disallows anyway.
          GH_TOKEN: ${{ secrets.GH_PAT }}
          PR_TITLE: "chore(data): refresh seeded calendar data"
          PR_BODY: "Auto-generated by the scheduled data seeder"
        run: |
          PR_URL=$(GH_TOKEN='${{ secrets.GITHUB_TOKEN }}' gh pr create --head "$BRANCH" --base main --title "$PR_TITLE" --body "$PR_BODY")
          echo "Created PR: $PR_URL"
          # --admin uses the PAT owner's admin bypass instead of requiring a review.
          gh pr merge "$PR_URL" --squash --delete-branch --admin
